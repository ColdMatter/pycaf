[tool.poetry]
name = "pycaf"
version = "0.1.0"
description = ""
authors = ["cafmot <cafmot@ic.ac.uk>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.11.4"

# --- Core Data Science & Math ---
numpy = "^1.26.4"
pandas = "^2.2.2"
scipy = "^1.13.1"
statsmodels = "^0.14.2"
numba = "^0.60.0"

# --- Visualization ---
matplotlib = "^3.8.4"
seaborn = "^0.13.2"
plotly = "^5.24.1"
# jupyterplot = "^0.0.3"  # from pip section
lrcurve = "^1.1.0"      # from pip section

# --- Hardware & Automation ---
pyserial = "^3.5"
pyvisa = "^1.14.1"
lakeshore = "^1.8.1"    # from pip section
pylablib = "^1.4.3"
pyautogui = "^0.9.54"
mouseinfo = "^0.1.3"

# --- GUI (Qt) ---
# Note: Your environment contained BOTH PyQt5 (conda) and PyQt6 (pip).
# This is usually a conflict. I have included both, but you should likely pick one.
PyQt5 = "=5.15.10"
PyQt5-qt5 = "=5.15.2"
# PyQt6 = "6.8.0"         # from pip section
# pyqtgraph = "^0.13.7"

# --- Utilities & Networking ---
pydantic = "^2.10.5"
rich = "^13.9.4"
paramiko = "^3.4.1"     # SSH client
rpyc = "^5.3.0"
plumbum = "^1.8.3"
pythonnet = "^3.0.5"    # .NET integration
wakepy = "^0.9.1"       # from pip section
iso8601 = "^2.1.0"      # from pip section

# --- Jupyter Stack ---
# (Usually you only need ipykernel/widgets, the rest are pulled in automatically)
ipykernel = "^6.28.0"
# ipywidgets = "^8.1.5"

# --- Windows Specific ---
# Constrained to Windows platform to prevent errors on Linux/Mac
pywin32 = {version = "305", platform = "win32"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"